; PlatformIO Configuration for PGK Flight Computer
; ==================================================
; STM32 Nucleo-H743ZI2 with Arduino framework
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor

[env:nucleo_h743zi2]
platform = ststm32
board = nucleo_h743zi2
framework = arduino
monitor_speed = 115200

build_flags =
    -DSTM32H7xx
    -DARDUINO_NUCLEO_H743ZI2
    -O2
    -Wall
    -Iinclude

; Library dependencies
lib_deps =
    Wire
    SPI
    Servo

; Source file filter
src_filter = +<src/>

; Upload protocol (ST-Link built into Nucleo)
upload_protocol = stlink

; Debug tool
debug_tool = stlink
